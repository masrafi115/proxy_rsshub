name: proxy_rsshub
on:
  schedule:
    - cron: "0 0 */4 * *"
  push:
    tags:
      - "test-*"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai # https://xirikm.net/2020/215-1
    steps:
      - name: Checkout
        uses: actions/checkout@v2 # Checking out the repo
        with:
          fetch-depth: 0
      # 1. This puts Python 3.11 on the machine so Pipenv can find it
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pipenv'
      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install "setuptools<66"
          pip install pipenv
      - name: Install dependecies
        run: |
          # Use --skip-lock if you don't have a Pipfile.lock in your repo yet
          pipenv install -d --skip-lock
      - name: Python build
        # env:
        #   _file_changes: ${{ steps.file_changes.outputs.files }}
        uses: VaultVulp/action-pipenv@v2.0.1
        with:
          command: run build
      - name: Commit files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git status
          git add .
          git diff-index --quiet HEAD || (git commit -m "Auto Commit" -a --no-verify)
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # branch: ${{ github.ref }}
          branch: refs/heads/main
