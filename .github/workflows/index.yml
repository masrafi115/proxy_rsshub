name: proxy_rsshub

on:
  schedule:
    - cron: "0 0 */4 * *"
  push:
    tags:
      - "test-*"
  workflow_dispatch:

jobs:
  push:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Crucial for pushing changes back to the repo
    env:
      TZ: Asia/Shanghai
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history for proper git pushing

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # No cache here to prevent "Pipfile.lock not found" errors

      - name: Install Pipenv
        run: |
          python -m pip install --upgrade pip
          pip install pipenv

      - name: Install dependencies
        run: |
          # --skip-lock allows it to run even if you don't have a Pipfile.lock in your repo
          pipenv install -d --skip-lock

      - name: Python build
        run: |
          pipenv run build

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          # Only commit if there are actual changes to avoid "nothing to commit" errors
          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Auto Commit: $(date +'%Y-%m-%d %H:%M')" -a --no-verify
            git push origin HEAD:main
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
